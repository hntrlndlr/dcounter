<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12181f">
<title>Drink-Zähler</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202a;--mut:#65727f;--line:#d9dfe5;--acc:#0f766e;--accink:#fff;--warn:#b45309;--bad:#b91c1c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12181f;--card:#1b242d;--ink:#e8edf2;--mut:#93a1ae;--line:#2b3744;--acc:#2dd4bf;--accink:#06201d;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:20px 0 8px}
small,.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.ctr span{font-size:26px;font-weight:700;min-width:30px;text-align:center}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.bad{color:var(--bad)}
.ctr button{width:56px;font-size:22px;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row>span{flex:1;min-width:0}
.row input[type=datetime-local]{width:auto;flex:0 0 auto;font-size:14px;min-height:40px}
.row button{min-height:40px;padding:6px 12px}
.when{display:flex;gap:8px;margin-bottom:12px}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
.big small{font-size:22px;font-weight:600;letter-spacing:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats b{display:block;font-size:22px}
.lab{display:block;margin-bottom:10px}.lab>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.cfg{display:grid;grid-template-columns:1fr 70px 70px 44px;gap:6px;margin-bottom:8px;align-items:center}
.cfg button{padding:0}
.note{border-left:4px solid var(--warn);padding:8px 12px;margin:12px 0;font-size:14px;background:var(--card);border-radius:0 10px 10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);font-size:13px;min-height:56px;padding:6px 2px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button data-t="drinks" onclick="tab=this.dataset.t;render()">Drinks</button>
  <button data-t="stats" onclick="tab=this.dataset.t;render()">Statistik</button>
  <button data-t="config" onclick="tab=this.dataset.t;render()">Getränke</button>
  <button data-t="settings" onclick="tab=this.dataset.t;render()">Einstellungen</button>
</nav>
<script>
const K='drinkzaehler.v1';
const DEF={settings:{sex:'m',age:30,height:180,weight:80,formula:'seidl',beta:0.1,deficit:10,absorb:30},
types:[{id:'t1',name:'Bier',ml:500,abv:5},{id:'t2',name:'Wein',ml:200,abv:12},{id:'t3',name:'Sekt',ml:100,abv:11},{id:'t4',name:'Shot',ml:40,abv:40},{id:'t5',name:'Cocktail',ml:200,abv:12}],drinks:[]};
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({},DEF,S);S.settings=Object.assign({},DEF.settings,S.settings);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='drinks',whenVal=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>String(+(+n).toFixed(1)).replace('.',',');
const f2=n=>(+n).toFixed(2).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const gram=(ml,abv)=>ml*abv/100*0.8;
const toLocal=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*60000).toISOString().slice(0,16);
const hm=ts=>new Date(ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});

/* ---------- Berechnung ---------- */
function rF(s){
  const w=s.weight,h=s.height,a=s.age,m=s.sex==='m';
  if(s.formula==='pauschal')return m?0.68:0.55;
  if(s.formula==='watson'){
    const tbw=m?2.447-0.09516*a+0.1074*h+0.3362*w:-2.097+0.1069*h+0.2466*w;
    return tbw/(0.8*w);
  }
  return m?0.31608-0.004821*w+0.004632*h:0.31223-0.006446*w+0.004466*h; // Seidl & Alt
}
// Minutenweise Simulation: Jeder Drink gelangt ab dem Eintragszeitpunkt (Trinkende) gleichmäßig über 'absorb' Minuten ins Blut.
// Der Abbau läuft stetig und geht nie unter 0.
function sim(){
  const d=[...S.drinks].sort((a,b)=>a.ts-b.ts);
  if(!d.length)return[];
  const s=S.settings,r=rF(s);
  if(!(s.weight>0&&r>0))return[];
  const A=Math.max(1,Math.round(s.absorb)||1),k=(1-s.deficit/100)/(s.weight*r),b=s.beta/60,M=60000;
  const st=Math.floor(d[0].ts/M)*M,endAbs=Math.floor(d[d.length-1].ts/M)*M+A*M;
  let c=0;const out=[];
  for(let t=st;t<st+7*864e5;t+=M){
    for(const x of d){const a=Math.floor(x.ts/M)*M;if(t>=a&&t<a+A*M)c+=x.g*k/A}
    out.push({t,c});
    if(t>=endAbs&&c<=b){out.push({t:t+M,c:0});break}
    c=Math.max(0,c-b);
  }
  return out;
}

/* ---------- Aktionen ---------- */
function add(id){
  const t=S.types.find(x=>x.id===id);if(!t)return;
  let ts=whenVal?new Date(whenVal).getTime():Date.now();if(isNaN(ts))ts=Date.now();
  S.drinks.push({id:uid(),typeId:id,name:t.name,ml:t.ml,abv:t.abv,g:gram(t.ml,t.abv),ts});save();render();
}
function rem(id){
  const l=S.drinks.filter(d=>d.typeId===id).sort((a,b)=>b.ts-a.ts)[0];
  if(l){S.drinks=S.drinks.filter(d=>d!==l);save();render()}
}
function del(id){S.drinks=S.drinks.filter(d=>d.id!==id);save();render()}
function setTs(id,v){const ts=new Date(v).getTime(),d=S.drinks.find(x=>x.id===id);if(d&&!isNaN(ts)){d.ts=ts;save();render()}}
function newNight(){if(confirm('Alle Drinks dieses Abends löschen?')){S.drinks=[];save();render()}}
function setT(i,k,v){const t=S.types[i];t[k]=k==='name'?v:Math.max(0,parseFloat(String(v).replace(',','.'))||0);save()}
function addT(){S.types.push({id:uid(),name:'Neu',ml:330,abv:5});save();render()}
function delT(i){S.types.splice(i,1);save();render()}
function setS(k,v,num){S.settings[k]=num?(parseFloat(String(v).replace(',','.'))||0):v;save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='drinkzaehler-backup.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o.settings||!o.types||!o.drinks)throw 0;S=o;save();render()}catch(e){alert('Datei ungültig. Bitte eine Backup-Datei dieser App wählen.')}})}
function wipe(){if(confirm('Wirklich alle Daten löschen?')){S=JSON.parse(JSON.stringify(DEF));save();render()}}

/* ---------- Seiten ---------- */
function pDrinks(){
  const cards=S.types.map(t=>{
    const n=S.drinks.filter(d=>d.typeId===t.id).length;
    return `<div class="card"><b>${esc(t.name)}</b><br><small>${f1(t.ml)} ml, ${f1(t.abv)} %</small>
    <div class="ctr"><button onclick="rem('${t.id}')" aria-label="Einen weniger">−</button><span>${n}</span><button class="pri" onclick="add('${t.id}')" aria-label="Eintragen">+</button></div></div>`}).join('')||'<p class="mut">Lege zuerst unter „Getränke“ ein Getränk an.</p>';
  const list=[...S.drinks].sort((a,b)=>b.ts-a.ts).map(d=>`<div class="row"><span>${esc(d.name)}<br><small>${f1(d.ml)} ml, ${f1(d.abv)} %</small></span>
    <input type="datetime-local" value="${toLocal(d.ts)}" onchange="setTs('${d.id}',this.value)"><button class="bad" onclick="del('${d.id}')" aria-label="Löschen">✕</button></div>`).join('')||'<p class="mut">Noch nichts eingetragen. Tippe oben auf + .</p>';
  return `<h1>Drinks</h1>
  <label class="mut" for="when">Zeitpunkt (wann ausgetrunken)</label>
  <div class="when"><input id="when" type="datetime-local" value="${whenVal||toLocal(Date.now())}" onchange="whenVal=this.value"><button onclick="whenVal=null;render()">Jetzt</button></div>
  <div class="grid">${cards}</div>
  <h2>Einträge</h2><div class="card">${list}</div>
  <p><button class="bad" onclick="newNight()">Neuer Abend (alles löschen)</button></p>`;
}

function pStats(){
  const s=S.settings,now=Date.now(),r=rF(s);
  if(!(s.weight>0&&s.height>0&&r>0))return `<h1>Statistik</h1><div class="note">Trage unter „Einstellungen“ Gewicht und Größe ein, damit der Promillewert berechnet werden kann.</div>`;
  const pts=sim();let cur=0;for(const p of pts)if(p.t<=now)cur=p.c;
  const peak=pts.reduce((m,p)=>Math.max(m,p.c),0),last=pts[pts.length-1],sober=last&&last.t>now?last.t:null;
  const g=S.drinks.reduce((a,d)=>a+d.g,0);
  const by={};S.drinks.forEach(d=>by[d.name]=(by[d.name]||0)+1);
  const byH=Object.entries(by).map(([n,c])=>`<div class="row"><span>${esc(n)}</span><b>${c}</b></div>`).join('')||'<p class="mut">Noch keine Drinks.</p>';
  let chart='';
  if(pts.length){
    const t0=pts[0].t,t1=Math.max(last.t,now,t0+1800000),ymax=Math.max(peak,0.5)*1.15,W=320,H=130;
    const X=t=>(t-t0)/(t1-t0)*W,Y=c=>H-c/ymax*H,step=Math.ceil(pts.length/250);
    let p=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(q=>X(q.t).toFixed(1)+','+Y(q.c).toFixed(1)).join(' ');
    const proj='';
    chart=`<h2>Verlauf</h2><div class="card"><svg viewBox="-2 -4 ${W+4} ${H+22}" role="img" aria-label="Promilleverlauf">
    <line x1="0" y1="${Y(0.5)}" x2="${W}" y2="${Y(0.5)}" stroke="var(--warn)" stroke-dasharray="2 4"/><text x="2" y="${Y(0.5)-3}" font-size="9" fill="var(--warn)">0,5 ‰</text>
    <polyline points="${p}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${proj}
    <line x1="${X(now)}" y1="0" x2="${X(now)}" y2="${H}" stroke="var(--mut)" stroke-width=".8"/>
    <text x="0" y="${H+14}" font-size="10" fill="var(--mut)">${hm(t0)}</text><text x="${W}" y="${H+14}" font-size="10" text-anchor="end" fill="var(--mut)">${hm(t1)}</text></svg>
    <small>Senkrechte Linie: jetzt. Rechts davon: erwarteter Verlauf, auch der noch nicht aufgenommene Alkohol.</small></div>`;
  }
  return `<h1>Statistik</h1>
  <div class="card"><div class="big">${f2(cur)}<small> ‰</small></div><small>geschätzter Wert jetzt</small></div>
  <div class="stats">
    <div class="card"><b>${S.drinks.length}</b><small>Drinks</small></div>
    <div class="card"><b>${Math.round(g)} g</b><small>reiner Alkohol</small></div>
    <div class="card"><b>${f2(peak)} ‰</b><small>Höchstwert</small></div>
    <div class="card"><b>${sober?hm(sober)+' Uhr':'–'}</b><small>voraussichtlich nüchtern</small></div>
  </div>${chart}
  <h2>Pro Getränk</h2><div class="card">${byH}</div>
  <div class="note">Das ist nur eine Schätzung nach Widmark. Essen, Trinktempo, Gesundheit und Tagesform ändern den echten Wert. Der Wert sagt nichts über deine Fahrtüchtigkeit aus.</div>`;
}

function pConfig(){
  const rows=S.types.map((t,i)=>`<div class="cfg"><input value="${esc(t.name)}" onchange="setT(${i},'name',this.value)" aria-label="Name">
    <input type="number" inputmode="decimal" value="${t.ml}" onchange="setT(${i},'ml',this.value)" aria-label="Volumen in ml">
    <input type="number" inputmode="decimal" step="0.1" value="${t.abv}" onchange="setT(${i},'abv',this.value)" aria-label="Alkohol in Prozent">
    <button class="bad" onclick="delT(${i})" aria-label="Löschen">✕</button></div>`).join('');
  return `<h1>Getränke</h1><p class="mut">Name, Volumen in ml und Alkoholgehalt in %. Bereits eingetragene Drinks ändern sich dadurch nicht.</p>
  <div class="cfg"><small>Name</small><small>ml</small><small>%</small><span></span></div>${rows}
  <button class="pri" onclick="addT()">Getränk hinzufügen</button>`;
}

function pSettings(){
  const s=S.settings,r=rF(s);
  const num=(k,l,st)=>`<label class="lab"><span>${l}</span><input type="number" inputmode="decimal" step="${st||1}" value="${s[k]}" onchange="setS('${k}',this.value,true)"></label>`;
  return `<h1>Einstellungen</h1>
  <label class="lab"><span>Geschlecht</span><select onchange="setS('sex',this.value)"><option value="m"${s.sex==='m'?' selected':''}>Männlich</option><option value="f"${s.sex==='f'?' selected':''}>Weiblich</option></select></label>
  ${num('age','Alter (Jahre, nur für Watson)')}${num('height','Größe (cm)')}${num('weight','Gewicht (kg)',0.5)}
  <label class="lab"><span>Formel für den Verteilungsfaktor r</span><select onchange="setS('formula',this.value)">
    <option value="seidl"${s.formula==='seidl'?' selected':''}>Seidl &amp; Alt (Gewicht, Größe)</option>
    <option value="watson"${s.formula==='watson'?' selected':''}>Watson (inkl. Alter)</option>
    <option value="pauschal"${s.formula==='pauschal'?' selected':''}>Pauschal (0,68 / 0,55)</option></select></label>
  <p class="mut">Aktueller Faktor r: ${r>0?f2(r):'–'}</p>
  ${num('beta','Abbau (‰ pro Stunde)',0.01)}${num('deficit','Resorptionsdefizit (%)')}${num('absorb','Aufnahmedauer ins Blut (Minuten)')}
  <small class="mut">Gängige Werte: Abbau 0,1 bis 0,15 ‰/h (0,1 ist die vorsichtige Annahme), Resorptionsdefizit etwa 10 %. Aufnahmedauer: 20 bis 120 Minuten nach Trinkende, 30 ist ein Mittelwert (Sekt, Alkohol auf nüchternen Magen: kürzer; viel Essen: länger).</small>
  <h2>Daten</h2>
  <p>Alles liegt nur in diesem Browser. Wenn du die Browserdaten löschst, ist es weg.</p>
  <p><button onclick="exp()">Backup speichern</button></p>
  <p><label class="mut">Backup laden<input type="file" accept="application/json" onchange="imp(this)"></label></p>
  <p><button class="bad" onclick="wipe()">Alle Daten löschen</button></p>`;
}

const PAGES={drinks:pDrinks,stats:pStats,config:pConfig,settings:pSettings};
function render(){
  const y=scrollY;
  document.getElementById('main').innerHTML=PAGES[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  scrollTo(0,y);
}
render();
setInterval(()=>{if(tab==='stats')render()},60000);
</script>
</body>
</html>
