<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12181f">
<title>Drink-Zähler</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202a;--mut:#65727f;--line:#d9dfe5;--acc:#0f766e;--accink:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#15803d;--yel:#a16207;--ora:#c2410c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12181f;--card:#1b242d;--ink:#e8edf2;--mut:#93a1ae;--line:#2b3744;--acc:#2dd4bf;--accink:#06201d;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80;--yel:#facc15;--ora:#fb923c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:20px 0 8px}
small,.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.ctr span{font-size:26px;font-weight:700;min-width:30px;text-align:center}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.bad{color:var(--bad)}
.ctr button{width:56px;font-size:22px;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row>span{flex:1;min-width:0}
.row input[type=datetime-local]{width:auto;flex:0 0 auto;font-size:14px;min-height:40px}
.row button{min-height:40px;padding:6px 12px}
.when{display:flex;gap:8px;margin-bottom:12px}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
.big small{font-size:22px;font-weight:600;letter-spacing:0}
.zone{margin:10px 0 0;font-size:15px}
.dot{font-size:18px;line-height:1}
.water{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.water.due{border-left:6px solid var(--acc)}
.wb{display:flex;gap:6px;flex:0 0 auto}
.stop{border-left:6px solid var(--ora);margin-bottom:12px}
.stop button{margin-top:8px}
details.card{margin-bottom:10px}
details summary{cursor:pointer}
details[open] summary{margin-bottom:10px}
.sec{padding:12px;margin-top:14px}
.sec>summary{font-size:17px}
.sec .card{background:var(--bg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats b{display:block;font-size:22px}
.lab{display:block;margin-bottom:10px}.lab>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.cfg{display:grid;grid-template-columns:1fr 70px 70px 44px;gap:6px;margin-bottom:8px;align-items:center}
.cfg button{padding:0}
.note{border-left:4px solid var(--warn);padding:8px 12px;margin:12px 0;font-size:14px;background:var(--card);border-radius:0 10px 10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);font-size:14px;min-height:56px;padding:6px 2px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button data-t="stats" onclick="tab=this.dataset.t;render()">Statistik</button>
  <button data-t="drinks" onclick="tab=this.dataset.t;render()">Drinks</button>
  <button data-t="settings" onclick="tab=this.dataset.t;render()">Einstellungen</button>
</nav>
<script>
const K='drinkzaehler.v1';
const DEF={settings:{sex:'m',age:30,height:180,weight:80,formula:'seidl',beta:0.1,deficit:10,absorb:30,waterRemind:true},
types:[{id:'t1',name:'Bier',ml:500,abv:5},{id:'t2',name:'Wein',ml:200,abv:12},{id:'t3',name:'Sekt',ml:100,abv:11},{id:'t4',name:'Shot',ml:40,abv:40},{id:'t5',name:'Cocktail',ml:200,abv:12}],drinks:[],water:[],log:[],evening:{start:null,end:null,food:1,stopH:2,dismissed:false,notified:false}};
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S);S.settings=Object.assign({},DEF.settings,S.settings);S.evening=Object.assign({},DEF.evening,S.evening);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='drinks',whenVal=null;const OPEN={};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>String(+(+n).toFixed(1)).replace('.',',');
const f2=n=>(+n).toFixed(2).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const gram=(ml,abv)=>ml*abv/100*0.8;
const toLocal=ts=>new Date(ts-new Date(ts).getTimezoneOffset()*60000).toISOString().slice(0,16);
const hm=ts=>new Date(ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});

/* ---------- Berechnung ---------- */
function rF(s){
  const w=s.weight,h=s.height,a=s.age,m=s.sex==='m';
  if(s.formula==='pauschal')return m?0.68:0.55;
  if(s.formula==='watson'){
    const tbw=m?2.447-0.09516*a+0.1074*h+0.3362*w:-2.097+0.1069*h+0.2466*w;
    return tbw/(0.8*w);
  }
  return m?0.31608-0.004821*w+0.004632*h:0.31223-0.006446*w+0.004466*h; // Seidl & Alt
}
// Essen vorher: nüchtern = schnellere Aufnahme, volle Mahlzeit = langsamer und mit größerem Resorptionsdefizit
function eff(){const s=S.settings,f=S.evening.food;return{A:Math.max(5,Math.round(s.absorb*[0.7,1,2][f])),def:Math.min(90,s.deficit*[0,1,2][f])}}
// Minutenweise Simulation: Jeder Drink gelangt ab dem Eintragszeitpunkt (Trinkende) gleichmäßig über 'absorb' Minuten ins Blut.
// Der Abbau läuft stetig und geht nie unter 0.
function sim(){
  const d=[...S.drinks].sort((a,b)=>a.ts-b.ts);
  if(!d.length)return[];
  const s=S.settings,r=rF(s);
  if(!(s.weight>0&&r>0))return[];
  const E=eff(),A=E.A,k=(1-E.def/100)/(s.weight*r),b=s.beta/60,M=60000;
  const st=Math.floor(d[0].ts/M)*M,endAbs=Math.floor(d[d.length-1].ts/M)*M+A*M;
  let c=0;const out=[];
  for(let t=st;t<st+7*864e5;t+=M){
    for(const x of d){const a=Math.floor(x.ts/M)*M;if(t>=a&&t<a+A*M)c+=x.g*k/A}
    out.push({t,c});
    if(t>=endAbs&&c<=b){out.push({t:t+M,c:0});break}
    c=Math.max(0,c-b);
  }
  return out;
}

const ZONES=[
{max:.02,c:'--mut',n:'Nüchtern',r:'0 ‰',t:'Keine Wirkung.'},
{max:.3,c:'--ok',n:'Leichte Wirkung',r:'bis 0,3 ‰',t:'Die Stimmung kann gehoben sein. Reaktion und Sehen lassen aber schon etwas nach.'},
{max:.5,c:'--yel',n:'Spürbare Wirkung',r:'0,3 bis 0,5 ‰',t:'Entfernungen sind schwerer einzuschätzen, Selbstüberschätzung beginnt. Fahren ist riskant.'},
{max:.8,c:'--ora',n:'Beeinträchtigt',r:'0,5 bis 0,8 ‰',t:'Die Reaktion ist deutlich schlechter, Enthemmung und Risikobereitschaft steigen.'},
{max:2,c:'--bad',n:'Deutlich berauscht',r:'0,8 bis 2 ‰',t:'Tunnelblick, Gleichgewichtsstörungen, Kontrollverlust möglich. Ab 1,1 ‰ gilt man als absolut fahruntüchtig.'},
{max:99,c:'--bad',n:'Gefährlich hoch',r:'ab 2 ‰',t:'Bewusstseinstrübung möglich. Trink nichts mehr, bleib nicht allein, bei Bewusstlosigkeit Notruf 112.'}];
const zone=v=>ZONES.find(z=>v<z.max)||ZONES[ZONES.length-1];

/* ---------- Aktionen ---------- */
function add(id){
  const t=S.types.find(x=>x.id===id);if(!t)return;
  let ts=whenVal?new Date(whenVal).getTime():Date.now();if(isNaN(ts))ts=Date.now();
  S.drinks.push({id:uid(),typeId:id,name:t.name,ml:t.ml,abv:t.abv,g:gram(t.ml,t.abv),ts});save();render();
}
function rem(id){
  const l=S.drinks.filter(d=>d.typeId===id).sort((a,b)=>b.ts-a.ts)[0];
  if(l){S.drinks=S.drinks.filter(d=>d!==l);save();render()}
}
function del(id){S.drinks=S.drinks.filter(d=>d.id!==id);save();render()}
function setTs(id,v){const ts=new Date(v).getTime(),d=S.drinks.find(x=>x.id===id);if(d&&!isNaN(ts)){d.ts=ts;save();render()}}
function addW(){S.water.push({id:uid(),ts:Date.now()});save();render()}
function remW(){S.water.pop();save();render()}
function setE(k,v){const e=S.evening;
  if(k==='food')e.food=Math.min(2,Math.max(0,parseInt(v)||0));
  else if(k==='stopH')e.stopH=Math.max(0,parseFloat(String(v).replace(',','.'))||0);
  else{const t=new Date(v).getTime();e[k]=isNaN(t)?null:t}
  e.dismissed=false;e.notified=false;save();render()}
function dismissStop(){S.evening.dismissed=true;save();render()}
function stopHtml(){
  const e=S.evening,left=e.end?e.end-Date.now():0;
  if(!e.end||left<=0||e.stopH<=0||left>e.stopH*36e5||e.dismissed)return'';
  const m=Math.round(left/60000),t=m>=60?`${Math.floor(m/60)} Std. ${m%60} Min.`:`${m} Min.`;
  let c=0;for(const p of sim())if(p.t<=e.end)c=p.c;
  return `<div class="card stop"><b>Jetzt keinen Alkohol mehr.</b> Noch ${t} bis zum Ende. Was du jetzt trinkst, wirkt erst nach 45 bis 75 Minuten, wird bis zum Gehen kaum noch abgebaut und verstärkt am Ende nur den Kater. Trink lieber Wasser.
  <br><small>Geschätzter Wert beim Gehen, wenn du jetzt aufhörst: ${f2(c)} ‰</small><br><button onclick="dismissStop()">Ausblenden</button></div>`;
}
// ---- Protokoll ----
let logForm=false;
const itemsOf=a=>{const m={};a.forEach(d=>{const k=d.name+'|'+d.ml+'|'+d.abv;(m[k]=m[k]||{name:d.name,ml:d.ml,abv:d.abv,n:0}).n++});return Object.values(m)};
const nOf=it=>it.reduce((a,x)=>a+x.n,0),gOf=it=>it.reduce((a,x)=>a+x.n*gram(x.ml,x.abv),0);
const dl=ts=>new Date(ts).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
function archive(){
  if(!S.drinks.length)return;
  const pts=sim(),pk=pts.reduce((m,p)=>p.c>m.c?p:m,{c:0,t:0});
  S.log.push({id:uid(),name:'',ts:Math.min(...S.drinks.map(d=>d.ts)),items:itemsOf(S.drinks),water:S.water.length,peak:pts.length?pk.c:null,peakTs:pts.length&&pk.c>0?pk.t:null,food:S.evening.food});
}
function newNight(keep){
  if(!confirm(keep?'Abend ins Protokoll speichern und neu beginnen?':'Abend verwerfen? Die Drinks werden nicht gespeichert.'))return;
  if(keep)archive();
  S.drinks=[];S.water=[];Object.assign(S.evening,{start:null,end:null,dismissed:false,notified:false});save();render();
}
function renameL(id,v){const e=S.log.find(x=>x.id===id);if(e){e.name=v.trim();save()}}
function delL(id){if(confirm('Diesen Eintrag aus dem Protokoll löschen?')){S.log=S.log.filter(x=>x.id!==id);save();render()}}
function saveManual(){
  const g=id=>document.getElementById(id),v=g('ldate').value||toLocal(Date.now()).slice(0,10);
  const ts=new Date(v+'T20:00').getTime();
  const items=S.types.map(t=>({name:t.name,ml:t.ml,abv:t.abv,n:Math.max(0,parseInt(g('ln_'+t.id).value)||0)})).filter(x=>x.n>0);
  if(!items.length){alert('Trage mindestens ein Getränk ein.');return}
  S.log.push({id:uid(),name:g('lname').value.trim(),ts:isNaN(ts)?Date.now():ts,items,water:0,peak:null,peakTs:null,food:null,manual:true});
  logForm=false;save();render();
}
function setT(i,k,v){const t=S.types[i];t[k]=k==='name'?v:Math.max(0,parseFloat(String(v).replace(',','.'))||0);save()}
function addT(){S.types.push({id:uid(),name:'Neu',ml:330,abv:5});save();render()}
function delT(i){S.types.splice(i,1);save();render()}
function setS(k,v,num){S.settings[k]=num?(parseFloat(String(v).replace(',','.'))||0):v;save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='drinkzaehler-backup.json';a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o.settings||!o.types||!o.drinks)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();render()}catch(e){alert('Datei ungültig. Bitte eine Backup-Datei dieser App wählen.')}})}
function wipe(){if(confirm('Wirklich alle Daten löschen?')){S=JSON.parse(JSON.stringify(DEF));save();render()}}

/* ---------- Seiten ---------- */
function pDrinks(){
  const cards=S.types.map(t=>{
    const n=S.drinks.filter(d=>d.typeId===t.id).length;
    return `<div class="card"><b>${esc(t.name)}</b><br><small>${f1(t.ml)} ml, ${f1(t.abv)} %</small>
    <div class="ctr"><button onclick="rem('${t.id}')" aria-label="Einen weniger">−</button><span>${n}</span><button class="pri" onclick="add('${t.id}')" aria-label="Eintragen">+</button></div></div>`}).join('')||'<p class="mut">Lege zuerst unter „Getränke“ ein Getränk an.</p>';
  const D=S.drinks.length,W=S.water.length,open=Math.max(0,D-W),on=S.settings.waterRemind;
  const waterBox=`<div class="card water${on&&open?' due':''}"><span>💧 ${on&&open?`<b>Zeit für ein Glas Wasser.</b> Noch ${open} offen.`:`Wasser: <b>${W}</b> Glas${D?` zu ${D} Drinks`:''}`}</span><span class="wb"><button onclick="remW()" aria-label="Eines weniger"${W?'':' disabled'}>−</button><button class="pri" onclick="addW()">Getrunken</button></span></div>`;
  const list=[...S.drinks].sort((a,b)=>b.ts-a.ts).map(d=>`<div class="row"><span>${esc(d.name)}<br><small>${f1(d.ml)} ml, ${f1(d.abv)} %</small></span>
    <input type="datetime-local" value="${toLocal(d.ts)}" onchange="setTs('${d.id}',this.value)"><button class="bad" onclick="del('${d.id}')" aria-label="Löschen">✕</button></div>`).join('')||'<p class="mut">Noch nichts eingetragen. Tippe oben auf + .</p>';
  return `<h1>Drinks</h1>
  <div id="stopbox">${stopHtml()}</div>${waterBox}<label class="mut" for="when">Zeitpunkt (wann ausgetrunken)</label>
  <div class="when"><input id="when" type="datetime-local" value="${whenVal||toLocal(Date.now())}" onchange="whenVal=this.value"><button onclick="whenVal=null;render()">Jetzt</button></div>
  <div class="grid">${cards}</div>
  <h2>Einträge</h2><div class="card">${list}</div>
  <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="pri" onclick="newNight(true)">Abend abschließen und speichern</button><button class="bad" onclick="newNight(false)">Verwerfen</button></p>`;
}

function pStats(){
  const s=S.settings,now=Date.now(),r=rF(s);
  if(!(s.weight>0&&s.height>0&&r>0))return `<h1>Statistik</h1><div class="note">Trage unter „Einstellungen“ Gewicht und Größe ein, damit der Promillewert berechnet werden kann.</div>`;
  const pts=sim();let cur=0;for(const p of pts)if(p.t<=now)cur=p.c;
  const pk=pts.reduce((m,p)=>p.c>m.c?p:m,{c:0,t:0}),peak=pk.c,last=pts[pts.length-1],sober=last&&last.t>now?last.t:null;
  const z=zone(cur),g=S.drinks.reduce((a,d)=>a+d.g,0);
  const by={};S.drinks.forEach(d=>by[d.name]=(by[d.name]||0)+1);
  const byH=Object.entries(by).map(([n,c])=>`<div class="row"><span>${esc(n)}</span><b>${c}</b></div>`).join('')||'<p class="mut">Noch keine Drinks.</p>';
  let chart='';
  if(pts.length){
    const t0=pts[0].t,t1=Math.max(last.t,now,t0+1800000),ymax=Math.max(peak,0.5)*1.15,W=320,H=130;
    const X=t=>(t-t0)/(t1-t0)*W,Y=c=>H-c/ymax*H,step=Math.ceil(pts.length/250);
    let p=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(q=>X(q.t).toFixed(1)+','+Y(q.c).toFixed(1)).join(' ');
    const bands=[[0,.3,'--ok'],[.3,.5,'--yel'],[.5,.8,'--ora'],[.8,99,'--bad']].filter(b=>b[0]<ymax).map(b=>{const hi=Math.min(b[1],ymax);return `<rect x="0" y="${Y(hi).toFixed(1)}" width="${W}" height="${(Y(b[0])-Y(hi)).toFixed(1)}" fill="var(${b[2]})" opacity=".16"/>`}).join('');
    chart=`<h2>Verlauf</h2><div class="card"><svg viewBox="-2 -4 ${W+4} ${H+22}" role="img" aria-label="Promilleverlauf">
    ${bands}
    <polyline points="${p}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="${X(now)}" y1="0" x2="${X(now)}" y2="${H}" stroke="var(--mut)" stroke-width=".8"/>
    <text x="0" y="${H+14}" font-size="10" fill="var(--mut)">${hm(t0)}</text><text x="${W}" y="${H+14}" font-size="10" text-anchor="end" fill="var(--mut)">${hm(t1)}</text></svg>
    <small>Farbige Bereiche: Zonen (siehe unten). Senkrechte Linie: jetzt. Rechts davon: erwarteter Verlauf, auch der noch nicht aufgenommene Alkohol.</small></div>`;
  }
  return `<h1>Statistik</h1>
  <div id="stopbox">${stopHtml()}</div>
  <div class="card" style="border-left:6px solid var(${z.c})"><div class="big" style="color:var(${z.c})">${f2(cur)}<small> ‰</small></div><small>geschätzter Wert jetzt</small>
    <p class="zone"><b>${z.n}.</b> ${z.t}</p></div>
  <div class="stats">
    <div class="card"><b>${S.drinks.length}</b><small>Drinks</small></div>
    <div class="card"><b>${Math.round(g)} g</b><small>reiner Alkohol</small></div>
    <div class="card"><b>${f2(peak)} ‰</b><small>Höchstwert${peak>0?` um ${hm(pk.t)} Uhr${pk.t>now?' (erwartet)':''}`:''}</small></div>
    <div class="card"><b>${sober?hm(sober)+' Uhr':'–'}</b><small>voraussichtlich nüchtern</small></div>
    <div class="card" style="grid-column:1/-1"><b>${S.water.length} Glas Wasser</b><small>bei ${S.drinks.length} Drinks. Wasser ändert den Promillewert nicht.</small></div>
  </div>${chart}
  <h2>Pro Getränk</h2><div class="card">${byH}</div>
  <h2>Zonen</h2><div class="card">${ZONES.map(q=>`<div class="row"><span class="dot" style="color:var(${q.c})">●</span><span><b>${q.n}</b><br><small>${q.r}</small></span></div>`).join('')}
  <small>Orientierungswerte aus Quellen wie ADAC und AOK. Die Wirkung ist individuell verschieden.</small></div>
  <div class="note">Das ist nur eine Schätzung nach Widmark. Essen, Trinktempo, Gesundheit und Tagesform ändern den echten Wert. Der Wert sagt nichts über deine Fahrtüchtigkeit aus.</div>`;
}

function pLog(){
  const L=[...S.log].sort((a,b)=>b.ts-a.ts),now=Date.now();
  const sum=a=>({e:a.length,n:a.reduce((x,e)=>x+nOf(e.items),0),g:a.reduce((x,e)=>x+gOf(e.items),0)});
  const T=sum(L),R=sum(L.filter(e=>e.ts>=now-30*864e5));
  const cur=S.drinks.length?`<div class="card" style="margin-bottom:10px"><b>Läuft gerade</b><br><small>${S.drinks.length} Drinks, ${Math.round(gOf(itemsOf(S.drinks)))} g Alkohol. Mit „Abend abschließen“ unter Drinks kommt der Abend hierher.</small></div>`:'';
  const cards=L.map(e=>{
    const n=nOf(e.items),g=gOf(e.items);
    return `<details class="card"${OPEN['e_'+e.id]?' open':''} ontoggle="OPEN['e_${e.id}']=this.open"><summary><b>${esc(e.name||'Abend am '+dl(e.ts))}</b><br><small>${dl(e.ts)}, ${n} Drinks, ${Math.round(g)} g Alkohol${e.peak!=null?`, Höchstwert ${f2(e.peak)} ‰`:''}</small></summary>
    ${e.items.map(x=>`<div class="row"><span>${x.n} × ${esc(x.name)}</span><small>${f1(x.ml)} ml, ${f1(x.abv)} %</small></div>`).join('')}
    <p class="mut">${e.peakTs?`Höchstwert um ${hm(e.peakTs)} Uhr. `:''}${e.manual?'Nachgetragen.':`Wasser: ${e.water} Glas. Essen: ${esc(FOOD[e.food??1][0])}.`}</p>
    <div class="when"><input placeholder="Name (optional)" value="${esc(e.name)}" onchange="renameL('${e.id}',this.value)"><button class="bad" onclick="delL('${e.id}')">Löschen</button></div></details>`}).join('')||'<p class="mut">Noch keine Abende im Protokoll.</p>';
  const form=logForm?`<div class="card" style="margin-bottom:10px"><b>Abend nachtragen</b>
    <label class="lab" style="margin-top:8px"><span>Datum</span><input id="ldate" type="date" value="${toLocal(now).slice(0,10)}"></label>
    <label class="lab"><span>Name (optional)</span><input id="lname"></label>
    ${S.types.map(t=>`<div class="row"><span>${esc(t.name)}<br><small>${f1(t.ml)} ml, ${f1(t.abv)} %</small></span><input id="ln_${t.id}" type="number" inputmode="numeric" min="0" value="0" style="width:80px"></div>`).join('')}
    <div class="when" style="margin-top:10px"><button class="pri" onclick="saveManual()">Speichern</button><button onclick="logForm=false;render()">Abbrechen</button></div></div>`:`<p><button onclick="logForm=true;render()">Abend nachtragen</button></p>`;
  return `<div class="stats" style="margin:0 0 10px"><div class="card"><b>${R.e}</b><small>Abende in 30 Tagen</small></div><div class="card"><b>${R.n}</b><small>Drinks in 30 Tagen (${Math.round(R.g)} g Alkohol)</small></div>
  <div class="card"><b>${T.e}</b><small>Abende insgesamt</small></div><div class="card"><b>${T.n}</b><small>Drinks insgesamt (${Math.round(T.g)} g Alkohol)</small></div></div>
  ${cur}${form}${cards}`;
}
const FOOD=[['Nüchtern','Länger nichts gegessen. Der Alkohol gelangt schneller ins Blut.'],['Kleiner Snack','Es gelten die Standardwerte aus Einstellungen, Profil.'],['Volle Mahlzeit','Zum Beispiel mit Fett und Eiweiß. Der Alkohol wird langsamer und etwas weniger aufgenommen.']];
const dt=ts=>new Date(ts).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'});
function pEvening(){
  const e=S.evening,E=eff(),bad=e.start&&e.end&&e.end<=e.start;
  const dur=e.start&&e.end&&!bad?(e.end-e.start)/36e5:null;
  const info=[dur!==null?`Dauer: ${f1(dur)} Stunden`:'',e.end&&e.stopH>0?`Letzter Alkohol: ${dt(e.end-e.stopH*36e5)} Uhr`:'Hinweis „kein Alkohol mehr“ ist aus'].filter(Boolean).join('<br>');
  return `<div class="lab"><span>Die Party beginnt</span><div class="when"><input type="datetime-local" value="${e.start?toLocal(e.start):''}" onchange="setE('start',this.value)"><button onclick="setE('start',toLocal(Date.now()))">Jetzt</button></div></div>
  <div class="lab"><span>Ich gehe um</span><input type="datetime-local" value="${e.end?toLocal(e.end):''}" onchange="setE('end',this.value)"></div>
  ${bad?'<div class="note">Das Ende liegt vor dem Start. Bitte prüfe die Zeiten.</div>':''}
  <label class="lab"><span>Was habe ich vorher gegessen?</span><select onchange="setE('food',this.value)">${FOOD.map((f,i)=>`<option value="${i}"${e.food===i?' selected':''}>${f[0]}</option>`).join('')}</select></label>
  <p class="mut">${FOOD[e.food][1]} Rechnerisch sind das ${E.A} Minuten Aufnahmedauer und ${f1(E.def)} % Resorptionsdefizit.</p>
  <label class="lab"><span>Hinweis „kein Alkohol mehr“, wenn das Ende näher ist als (Stunden, 0 = aus)</span><input type="number" inputmode="decimal" step="0.5" value="${e.stopH}" onchange="setE('stopH',this.value)"></label>
  <div class="card">${info}</div>
  <p class="mut">Der Hinweis erscheint oben bei Drinks und Statistik, solange die App offen ist. Auf dem Handy vibriert sie einmal, wenn er startet (nicht auf jedem Gerät).</p>`;
}
function pConfig(){
  const rows=S.types.map((t,i)=>`<div class="cfg"><input value="${esc(t.name)}" onchange="setT(${i},'name',this.value)" aria-label="Name">
    <input type="number" inputmode="decimal" value="${t.ml}" onchange="setT(${i},'ml',this.value)" aria-label="Volumen in ml">
    <input type="number" inputmode="decimal" step="0.1" value="${t.abv}" onchange="setT(${i},'abv',this.value)" aria-label="Alkohol in Prozent">
    <button class="bad" onclick="delT(${i})" aria-label="Löschen">✕</button></div>`).join('');
  return `<p class="mut">Name, Volumen in ml und Alkoholgehalt in %. Bereits eingetragene Drinks ändern sich dadurch nicht.</p>
  <div class="cfg"><small>Name</small><small>ml</small><small>%</small><span></span></div>${rows}
  <button class="pri" onclick="addT()">Getränk hinzufügen</button>`;
}

function pSettings(){
  const s=S.settings,r=rF(s);
  const num=(k,l,st)=>`<label class="lab"><span>${l}</span><input type="number" inputmode="decimal" step="${st||1}" value="${s[k]}" onchange="setS('${k}',this.value,true)"></label>`;
  return `<label class="lab"><span>Geschlecht</span><select onchange="setS('sex',this.value)"><option value="m"${s.sex==='m'?' selected':''}>Männlich</option><option value="f"${s.sex==='f'?' selected':''}>Weiblich</option></select></label>
  ${num('age','Alter (Jahre, nur für Watson)')}${num('height','Größe (cm)')}${num('weight','Gewicht (kg)',0.5)}
  <label class="lab"><span>Formel für den Verteilungsfaktor r</span><select onchange="setS('formula',this.value)">
    <option value="seidl"${s.formula==='seidl'?' selected':''}>Seidl &amp; Alt (Gewicht, Größe)</option>
    <option value="watson"${s.formula==='watson'?' selected':''}>Watson (inkl. Alter)</option>
    <option value="pauschal"${s.formula==='pauschal'?' selected':''}>Pauschal (0,68 / 0,55)</option></select></label>
  <label class="lab"><span>Wasser-Erinnerung nach jedem Drink</span><select onchange="setS('waterRemind',this.value==='1')"><option value="1"${s.waterRemind?' selected':''}>An</option><option value="0"${s.waterRemind?'':' selected'}>Aus</option></select></label>
  <p class="mut">Aktueller Faktor r: ${r>0?f2(r):'–'}</p>
  ${num('beta','Abbau (‰ pro Stunde)',0.01)}${num('deficit','Resorptionsdefizit (%)')}${num('absorb','Aufnahmedauer ins Blut (Minuten)')}
  <small class="mut">Diese Werte gelten für „Kleiner Snack“. Im Bereich „Abend“ (Reiter Drinks) werden sie je nach Essen angepasst. Gängige Werte: Abbau 0,1 bis 0,15 ‰/h (0,1 ist die vorsichtige Annahme), Resorptionsdefizit etwa 10 %. Aufnahmedauer: 20 bis 120 Minuten nach Trinkende, 30 ist ein Mittelwert (Sekt, Alkohol auf nüchternen Magen: kürzer; viel Essen: länger).</small>
  <h2>Daten</h2>
  <p>Alles liegt nur in diesem Browser. Wenn du die Browserdaten löschst, ist es weg.</p>
  <p><button onclick="exp()">Backup speichern</button></p>
  <p><label class="mut">Backup laden<input type="file" accept="application/json" onchange="imp(this)"></label></p>
  <p><button class="bad" onclick="wipe()">Alle Daten löschen</button></p>`;
}

const sec=(k,t,b)=>`<details class="card sec"${OPEN[k]?' open':''} ontoggle="OPEN['${k}']=this.open"><summary><b>${t}</b></summary>${b}</details>`;
const PAGES={
  stats:()=>pStats()+sec('log','Protokoll',pLog()),
  drinks:()=>pDrinks()+sec('evening','Abend',pEvening()),
  settings:()=>'<h1>Einstellungen</h1>'+sec('config','Getränke',pConfig())+sec('profile','Profil',pSettings())
};
function render(){
  const y=scrollY;
  document.getElementById('main').innerHTML=PAGES[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  scrollTo(0,y);
}
render();
setInterval(()=>{
  const e=S.evening,n=Date.now();
  if(e.end&&e.stopH>0&&!e.notified&&n<e.end&&n>=e.end-e.stopH*36e5){e.notified=true;save();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}
  if(tab==='stats'){if(!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render()}else{const b=document.getElementById('stopbox');if(b)b.innerHTML=stopHtml()}
},30000);
</script>
</body>
</html>
